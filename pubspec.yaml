workflows:
  android-workflow:
    name: Crypto Signal Android
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Fix Dart SDK constraint and generate Android project
        script: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()
          if re.search(r"(?m)^environment:\s*$", s):
              if re.search(r"(?m)^  sdk:\s*", s):
                  s = re.sub(r"(?m)^  sdk:\s*.*$", "  sdk: '^3.13.0'", s)
              else:
                  s = re.sub(r"(?m)^environment:\s*$", "environment:\n  sdk: '^3.13.0'", s, count=1)
          else:
              s += "\n\nenvironment:\n  sdk: '^3.13.0'\n"
          p.write_text(s)
          print("Dart SDK constraint set to ^3.13.0")
          PYCODE
          flutter create --platforms=android .

      - name: Configure Android internet and desugaring
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if "android.permission.INTERNET" not in xml:
              xml = xml.replace("<application", permission + "    <application", 1)
              manifest.write_text(xml)
          print("Internet permission ensured.")

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          if groovy.exists():
              gradle = groovy
              flag = "coreLibraryDesugaringEnabled true"
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          elif kotlin.exists():
              gradle = kotlin
              flag = "isCoreLibraryDesugaringEnabled = true"
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              raise Exception("Android app Gradle file not found")

          s = gradle.read_text()
          if flag not in s:
              s = s.replace("compileOptions {", "compileOptions {\n        " + flag, 1)
          if dep not in s:
              s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
          gradle.write_text(s)
          print("Desugaring enabled in", gradle)
          PY

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
