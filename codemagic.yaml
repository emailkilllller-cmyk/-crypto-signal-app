workflows:
  android-workflow:
    name: Crypto Signal Android
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Add Dart SDK constraint before project generation
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('pubspec.yaml')
          s = p.read_text()
          constraint = "sdk: '>=3.13.0 <4.0.0'"

          if re.search(r'(?m)^environment:\s*$', s):
              if re.search(r'(?m)^\s+sdk:\s*', s):
                  s = re.sub(r'(?m)^\s+sdk:\s*.*$', '  ' + constraint, s, count=1)
              else:
                  s = re.sub(r'(?m)^environment:\s*$', 'environment:\n  ' + constraint, s, count=1)
          else:
              s += '\n\nenvironment:\n  ' + constraint + '\n'

          p.write_text(s)
          print('Updated pubspec.yaml SDK constraint: ' + constraint)
          PY

      - name: Generate Android project
        script: flutter create --platforms=android .

      - name: Add Internet permission
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace('<manifest', '<manifest', 1)
              s = s.replace('>', '>\n    ' + permission, 1)
              p.write_text(s)
          print('Internet permission checked')
          PY

      - name: Enable Android desugaring
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle.kts')
          if p.exists():
              s = p.read_text()
              if 'isCoreLibraryDesugaringEnabled = true' not in s:
                  s = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
                  s = re.sub(r'dependencies\s*\{', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', s, count=1)
              p.write_text(s)
          else:
              p = Path('android/app/build.gradle')
              if p.exists():
                  s = p.read_text()
                  if 'coreLibraryDesugaringEnabled true' not in s:
                      s = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        coreLibraryDesugaringEnabled true', s, count=1)
                  if 'desugar_jdk_libs:2.1.4' not in s:
                      s = re.sub(r'dependencies\s*\{', 'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"', s, count=1)
                  p.write_text(s)
          print('Desugaring configured')
          PY

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
