workflows:
  android-workflow:
    name: Crypto Signal Android
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Add Dart SDK constraint before project generation
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('pubspec.yaml')
          s = p.read_text()
          constraint = "sdk: '>=3.13.0 <4.0.0'"

          if re.search(r'(?m)^environment:\s*$', s):
              if re.search(r'(?m)^\s+sdk:\s*', s):
                  s = re.sub(r'(?m)^\s+sdk:\s*.*$', '  ' + constraint, s, count=1)
              else:
                  s = re.sub(r'(?m)^environment:\s*$', 'environment:\n  ' + constraint, s, count=1)
          else:
              s += '\n\nenvironment:\n  ' + constraint + '\n'

          p.write_text(s)
          print('Updated pubspec.yaml SDK constraint: ' + constraint)
          PY

      - name: Generate Android project
        script: flutter create --platforms=android .

      - name: Add Internet permission
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace('<manifest', '<manifest', 1)
              s = s.replace('>', '>\n    ' + permission, 1)
              p.write_text(s)
          print('Internet permission checked')
          PY

      - name: Enable Android desugaring
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle.kts')
          kotlin_dsl = p.exists()
          if not kotlin_dsl:
              p = Path('android/app/build.gradle')
          if not p.exists():
              raise SystemExit('ERROR: app Gradle file not found')

          s = p.read_text()

          # Enable desugaring inside compileOptions.
          flag = ('isCoreLibraryDesugaringEnabled = true' if kotlin_dsl
                  else 'coreLibraryDesugaringEnabled true')
          if flag not in s:
              if re.search(r'compileOptions\\s*\\{', s):
                  s = re.sub(r'compileOptions\\s*\\{',
                             lambda m: m.group(0) + '\\n        ' + flag,
                             s, count=1)
              else:
                  raise SystemExit('ERROR: compileOptions block not found')

          # Ensure the dependency is in the app module.
          dep = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                 if kotlin_dsl else
                 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"')
          if 'desugar_jdk_libs' not in s:
              if re.search(r'(?m)^dependencies\\s*\\{', s):
                  s = re.sub(r'(?m)^dependencies\\s*\\{',
                             lambda m: m.group(0) + '\\n    ' + dep,
                             s, count=1)
              else:
                  s += '\\n\\ndependencies {\\n    ' + dep + '\\n}\\n'

          p.write_text(s)
          print('Gradle file:', p)
          print('Desugaring flag present:', flag in s)
          print('Desugaring dependency present:', 'desugar_jdk_libs' in s)
          if flag not in s or 'desugar_jdk_libs' not in s:
              raise SystemExit('ERROR: desugaring configuration incomplete')
          PY

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
