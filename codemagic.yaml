workflows:
  android-workflow:
    name: Crypto Signal Lab Android
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      android_signing:
        - crypto_signal_release
      flutter: stable

    scripts:
      - name: Add Dart SDK constraint before project generation
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('pubspec.yaml')
          s = p.read_text()
          constraint = "sdk: '>=3.13.0 <4.0.0'"

          if re.search(r'(?m)^environment:\s*$', s):
              if re.search(r'(?m)^\s+sdk:\s*', s):
                  s = re.sub(r'(?m)^\s+sdk:\s*.*$', '  ' + constraint, s, count=1)
              else:
                  s = re.sub(r'(?m)^environment:\s*$', 'environment:\n  ' + constraint, s, count=1)
          else:
              s += '\n\nenvironment:\n  ' + constraint + '\n'

          p.write_text(s)
          print('Updated pubspec.yaml SDK constraint: ' + constraint)
          PY

      - name: Generate Android project
        script: flutter create --org com.sohail.cryptolab --project-name crypto_signal_lab --platforms=android .

      - name: Set experimental app display name
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s, count = re.subn(r'android:label="[^"]*"', 'android:label="Crypto Signal Lab Test"', s, count=1)
          if count == 0:
              raise SystemExit('ERROR: Android app label not found')
          p.write_text(s)
          print('Launcher label set to Crypto Signal Lab Test')
          PY

      - name: Add Internet permission
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              # Insert after the opening manifest tag, not the XML declaration.
              import re
              m = re.search(r'<manifest\b[^>]*>', s)
              if not m:
                  raise SystemExit('ERROR: manifest opening tag not found')
              s = s[:m.end()] + '\n    ' + permission + s[m.end():]
              p.write_text(s)
          print('Internet permission checked')
          PY

      - name: Enable Android desugaring
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle.kts')
          kotlin_dsl = gradle.exists()
          if not kotlin_dsl:
              gradle = Path('android/app/build.gradle')
          if not gradle.exists():
              raise SystemExit('ERROR: app Gradle file not found')

          s = gradle.read_text()

          # Add/enable compileOptions inside android { ... }.
          if kotlin_dsl:
              flag = 'isCoreLibraryDesugaringEnabled = true'
              compile_block = '''compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }'''
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              flag = 'coreLibraryDesugaringEnabled true'
              compile_block = '''compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }'''
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if 'compileOptions' not in s:
              # Insert into android block immediately after its opening brace.
              m = re.search(r'(?m)^android\s*\{', s)
              if not m:
                  raise SystemExit('ERROR: android { } block not found')
              s = s[:m.end()] + '\n    ' + compile_block + s[m.end():]
          elif flag not in s:
              # Existing compileOptions block: insert the desugaring flag.
              m = re.search(r'compileOptions\s*\{', s)
              if not m:
                  raise SystemExit('ERROR: compileOptions block parsing failed')
              s = s[:m.end()] + '\n        ' + flag + s[m.end():]

          if 'desugar_jdk_libs' not in s:
              m = re.search(r'(?m)^dependencies\s*\{', s)
              if m:
                  s = s[:m.end()] + '\n    ' + dep + s[m.end():]
              else:
                  s += '\n\ndependencies {\n    ' + dep + '\n}\n'

          gradle.write_text(s)
          print('Gradle file configured:', gradle)
          print('compileOptions found:', 'compileOptions' in s)
          print('Desugaring flag found:', flag in s)
          print('Desugaring dependency found:', 'desugar_jdk_libs' in s)
          if flag not in s or 'desugar_jdk_libs' not in s:
              raise SystemExit('ERROR: desugaring not configured correctly')
          PY

      - name: Configure Android release signing
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle.kts')
          kotlin_dsl = gradle.exists()
          if not kotlin_dsl:
              gradle = Path('android/app/build.gradle')
          if not gradle.exists():
              raise SystemExit('ERROR: Android app Gradle file not found')

          s = gradle.read_text()

          if kotlin_dsl:
              signing_block = '''
              signingConfigs {
                  create("release") {
                      if (System.getenv()["CI"].toBoolean()) {
                          storeFile = file(System.getenv()["CM_KEYSTORE_PATH"]
                              ?: error("CM_KEYSTORE_PATH is missing"))
                          storePassword = System.getenv()["CM_KEYSTORE_PASSWORD"]
                              ?: error("CM_KEYSTORE_PASSWORD is missing")
                          keyAlias = System.getenv()["CM_KEY_ALIAS"]
                              ?: error("CM_KEY_ALIAS is missing")
                          keyPassword = System.getenv()["CM_KEY_PASSWORD"]
                              ?: error("CM_KEY_PASSWORD is missing")
                      }
                  }
              }
              '''
              release_signing = 'signingConfig = signingConfigs.getByName("release")'
              debug_signing = 'signingConfig = signingConfigs.getByName("debug")'
          else:
              signing_block = '''
              signingConfigs {
                  release {
                      if (System.getenv()["CI"]) {
                          storeFile file(System.getenv()["CM_KEYSTORE_PATH"])
                          storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                          keyAlias System.getenv()["CM_KEY_ALIAS"]
                          keyPassword System.getenv()["CM_KEY_PASSWORD"]
                      }
                  }
              }
              '''
              release_signing = 'signingConfig signingConfigs.release'
              debug_signing = 'signingConfig signingConfigs.debug'

          if 'signingConfigs' in s and 'create("release")' in s or (
              'signingConfigs' in s and re.search(r'(?s)signingConfigs\s*\{.*?release\s*\{', s)
          ):
              raise SystemExit('ERROR: A release signing config already exists; refusing to duplicate it')

          # Insert the release signing config inside android {}, immediately before buildTypes.
          m = re.search(r'(?m)^\s*buildTypes\s*\{', s)
          if not m:
              raise SystemExit('ERROR: buildTypes block not found in generated Gradle file')
          s = s[:m.start()] + signing_block + '\n' + s[m.start():]

          # Replace the generated debug signing assignment in the release build type.
          if debug_signing in s:
              s = s.replace(debug_signing, release_signing, 1)
          elif release_signing not in s:
              # If the template has no explicit signing line, insert it into release { }.
              m = re.search(r'(?m)^\s*release\s*\{', s)
              if not m:
                  raise SystemExit('ERROR: release build type block not found')
              brace = s.find('{', m.start())
              depth = 0
              end = None
              for i in range(brace, len(s)):
                  if s[i] == '{':
                      depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end is None:
                  raise SystemExit('ERROR: could not parse release build type block')
              s = s[:end] + '\n        ' + release_signing + '\n    ' + s[end:]

          gradle.write_text(s)
          if release_signing not in s:
              raise SystemExit('ERROR: release signing assignment was not applied')
          print('Android release signing configured in', gradle)
          print('Codemagic keystore reference: crypto_signal_release')
          PY
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
